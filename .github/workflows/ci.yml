name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint all implemented feature combinations
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify no native FFI dependency is required
        run: |
          if cargo tree --locked --edges normal --prefix none | grep -Eq -- '-(sys|ffi) v'; then
            echo 'C/C++ FFI dependency detected.' >&2
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.toolchain }}, ${{ matrix.feature_set }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, toolchain: stable, feature_set: default, cargo_args: "" }
          - { os: ubuntu-latest, toolchain: stable, feature_set: no-default-features, cargo_args: --no-default-features }
          - { os: macos-latest, toolchain: stable, feature_set: default, cargo_args: "" }
          - { os: macos-latest, toolchain: stable, feature_set: no-default-features, cargo_args: --no-default-features }
          - { os: windows-latest, toolchain: stable, feature_set: default, cargo_args: "" }
          - { os: windows-latest, toolchain: stable, feature_set: no-default-features, cargo_args: --no-default-features }
          - { os: ubuntu-latest, toolchain: "1.91", feature_set: default, cargo_args: "" }
          - { os: ubuntu-latest, toolchain: "1.91", feature_set: no-default-features, cargo_args: --no-default-features }
          - { os: macos-latest, toolchain: "1.91", feature_set: default, cargo_args: "" }
          - { os: macos-latest, toolchain: "1.91", feature_set: no-default-features, cargo_args: --no-default-features }
          - { os: windows-latest, toolchain: "1.91", feature_set: default, cargo_args: "" }
          - { os: windows-latest, toolchain: "1.91", feature_set: no-default-features, cargo_args: --no-default-features }

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}

      - name: Test
        run: cargo test --locked ${{ matrix.cargo_args }}

  documentation:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build default-feature documentation
        run: cargo doc --locked --no-deps

      - name: Build no-default-feature documentation
        run: cargo doc --locked --no-deps --no-default-features

  dependency-policy:
    name: Check advisories and licenses
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  backend-evaluation:
    name: Build backend evaluation harness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path tools/backend-evaluation/Cargo.toml --locked
