name: Periodic verification

on:
  schedule:
    - cron: "17 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-properties:
    name: Extended property tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZDD_PROPTEST_CASES: "4096"
      ZDD_EXTENDED_FRONTIER_CASES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Test all features
        run: cargo test --locked --all-features

      - name: Test graph-independent build
        run: cargo test --locked --no-default-features

  fuzz:
    name: Fixed-seed API fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Fuzz family operation sequences
        run: cargo fuzz run family_operations -- -max_total_time=300 -seed=22001

      - name: Fuzz graph inputs and orderings
        run: cargo fuzz run graph_inputs -- -max_total_time=300 -seed=22002

      - name: Fuzz imports, limits, and recovery
        run: cargo fuzz run import_limits -- -max_total_time=300 -seed=22003

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
