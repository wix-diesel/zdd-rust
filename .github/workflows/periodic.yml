name: Periodic verification

on:
  schedule:
    - cron: "17 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-properties:
    name: Extended property tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZDD_PROPTEST_CASES: "4096"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Test all features
        run: cargo test --locked --all-features

      - name: Test graph-independent build
        run: cargo test --locked --no-default-features
